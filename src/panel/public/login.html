<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vendas-multicanal — entrar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="form">
      <div class="brand"><b>vendas-multicanal</b> <span>·</span> <span class="muted" style="font-size:13px;font-weight:500">painel de operações</span></div>
      <p>Acesso restrito. Informe a senha do painel.</p>
      <label for="pw">Senha</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" autofocus>
      <button class="btn block" type="submit">Entrar</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('form')
    const err = document.getElementById('err')
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      err.textContent = ''
      const password = document.getElementById('pw').value
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password }) })
        if (r.ok) { location.href = '/' } else { err.textContent = 'Senha incorreta.' }
      } catch { err.textContent = 'Falha de conexão.' }
    })
  </script>
</body>
</html>
